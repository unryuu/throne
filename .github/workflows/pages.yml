# Builds the static spectator page (apps/spectator) and publishes it to GitHub Pages.
name: Spectator page

on:
  push:
    branches: [main]
    paths:
      - "apps/spectator/**"
      - "packages/court/**"
      - "packages/localization/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Only the page and its workspace dependencies; the live game's native modules are not needed.
      - run: pnpm install --frozen-lockfile --filter "@throne/spectator..."
      - run: pnpm --filter @throne/spectator build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/spectator/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
