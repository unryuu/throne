# Appended to /etc/nginx/nginx.conf at top level (outside http {}).
# 443 is shared: the game by SNI, everything else to xray (REALITY).
stream {
    map $ssl_preread_server_name $throne_upstream {
        1566.unryuu.top 127.0.0.1:8443;
        default         127.0.0.1:10443;
    }
    server {
        listen 443;
        listen [::]:443;
        ssl_preread on;
        proxy_pass $throne_upstream;
        proxy_connect_timeout 10s;
        proxy_timeout 1800s;
    }
}
